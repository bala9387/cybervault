name: Real-Life CSRF Double Bypass
author: CyberVault Team
category: Web
difficulty: Hard
description: |
  CyberVault's credit transfer feature at /api/transfer is guarded by two security controls:
  1. A Referer header domain check.
  2. An Anti-CSRF token check.

  Analyze the backend logic to find flaws in BOTH security controls and execute a successful cross-site state-changing request to capture the flag.

  Target URL: https://cybervault-rho.vercel.app/dashboard
  Flag Format: FLAG{...}
value: 300
type: standard
flags:
  - FLAG{CSRF_STATE_CHANGING_ATTACK}
files: []
state: visible
version: "0.1"
requirements: []
hints:
  - "Hint 1: What happens if the csrf_token parameter is completely omitted from the POST request body?"
  - "Hint 2: How does the server inspect the Referer header? Can you trick a substring check using a URL query parameter like ?cybervault?"
