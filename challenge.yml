name: CyberVault - Web Security Portal
author: CyberVault Team
category: Web
difficulty: Easy
description: |
  Welcome to CyberVault, an enterprise employee portal. 
  Your goal is to inspect the website using Browser Developer Tools to discover all hidden flags.

  Challenges included:
  1. HTML Source Flag
  2. JWT Token Payload Flag
  3. Robots.txt 404 Curl Flag
  4. SSRF Localhost Filter Bypass Flag (HARD)

  Target URL: http://localhost:3000

  Flag Format: FLAG{...}
value: 400
type: standard
flags:
  - FLAG{SOURCE_INSPECTOR}
  - FLAG{TOKEN_DECODER}
  - FLAG{CURL_ROBOTS_MASTER}
  - FLAG{SSRF_FILTER_BYPASS_SUCCESS}
files: []
state: visible
version: "0.1"
requirements: []
hints:
  - "Hint 1: The browser stores more than pages."
  - "Hint 2: Developers often leave secrets in plain sight."
  - "Hint 3: Inspect every request."
  - "Hint 4: Storage, Cookies, Source, Network."
